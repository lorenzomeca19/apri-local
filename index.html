<!DOCTYPE html>
<html>
  <head>
    <title>Apertura Percorso Locale...</title>
  </head>

  <body>
    <p>Tentativo di apertura del file in corso...</p>

    <script>
      // Prende tutto ciò che c'è dopo ?path=
      const urlParams = new URLSearchParams(window.location.search);
      const path = urlParams.get('path');

      if (path) {
        // Reindirizza al tuo protocollo Electron
        window.location.href = `open-local://${path}`;

        // Chiude la scheda dopo 1 secondo per non lasciare residui nel browser
        setTimeout(() => {
          window.close();
        }, 1000);
      } else {
        document.body.innerHTML = "Errore: Nessun percorso specificato.";
      }
    </script>
  </body>
</html>
